name: Validate Skills

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run repository validation
        run: |
          python3 scripts/validate_skills.py
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 scripts/run_behavior_evals.py --skill dsa-design --answers evals/fixtures/dsa-design
          python3 scripts/run_behavior_evals.py --skill napi-rs --answers evals/fixtures/napi-rs
