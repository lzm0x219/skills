interface:
  display_name: "DSA Design"
  short_description: "DSA options and recommendations for real trade-offs"
  default_prompt: "Use $dsa-design only for requests with material data-structure or algorithm trade-offs: compare necessary options and recommend. If there is no material DSA decision, handle the request normally. Pause only when I have not authorized the choice and it would change a public interface, irreversible persistence, a critical dependency, or product semantics."

policy:
  allow_implicit_invocation: true
